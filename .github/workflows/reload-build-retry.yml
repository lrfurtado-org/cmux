name: reload-build retry

# Fork-only (lrfurtado/cmux). GitHub-hosted macos-26 runners are often at
# capacity; a job that no runner picks up is cancelled after ~15 minutes with
# "The job was not acquired by Runner of type hosted even after multiple
# attempts", and no workflow setting lengthens that wait. This re-runs the
# latest reload-build run when, and only when, its build job was cancelled
# without running a single step. It never retries a real build failure.

on:
  # Manual only: dispatch it after a reload-build run sat unacquired.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: reload-build-retry
  cancel-in-progress: false

jobs:
  retry:
    if: ${{ github.repository_owner != 'manaflow-ai' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAX_ATTEMPTS: "40"
    steps:
      - name: Re-run an unacquired reload-build
        run: |
          set -euo pipefail
          run="$(gh run list --workflow reload-build.yml --limit 1 \
            --json databaseId,status,conclusion,attempt,displayTitle \
            --jq '.[0] // empty')"
          if [ -z "$run" ]; then
            echo "No reload-build runs."
            exit 0
          fi
          id="$(jq -r .databaseId <<<"$run")"
          status="$(jq -r .status <<<"$run")"
          conclusion="$(jq -r .conclusion <<<"$run")"
          attempt="$(jq -r .attempt <<<"$run")"
          title="$(jq -r .displayTitle <<<"$run")"
          echo "Latest: run $id '$title' attempt=$attempt status=$status conclusion=$conclusion"

          if [ "$status" != "completed" ] || [ "$conclusion" != "failure" ]; then
            echo "Nothing to retry."
            exit 0
          fi
          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
            echo "::warning::Run $id reached $MAX_ATTEMPTS attempts; giving up."
            exit 0
          fi

          # Retry only when the build job never got a runner: cancelled with no steps.
          unacquired="$(gh api "repos/$GH_REPO/actions/runs/$id/attempts/$attempt/jobs" \
            --jq '[.jobs[] | select(.name == "build" and .conclusion == "cancelled" and ((.steps // []) | length) == 0)] | length')"
          if [ "$unacquired" = "0" ]; then
            echo "Build failed after it started; not retrying."
            exit 0
          fi

          echo "Build job was never picked up by a runner; re-running run $id."
          gh run rerun "$id" --failed
